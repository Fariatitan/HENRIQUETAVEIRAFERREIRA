<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HENRIQUE TAVEIRA — Página não encontrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --ink: #0D0D0D;
      --muted: #666666;
      --font: 'Jost', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .kicker {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 300;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 0.95;
      margin-bottom: 2rem;
    }
    p {
      font-size: 18px;
      font-weight: 300;
      color: var(--muted);
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 3rem;
    }
    a {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 4px;
      transition: opacity 0.3s;
    }
    a:hover { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="kicker">404 — Não Encontrado</div>
  <h1>Henrique Taveira</h1>
  <p>A página que você está procurando não existe ou foi movida.</p>
  <a href="./">Retornar ao Início →</a>
</body>
</html>
